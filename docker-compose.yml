# Zou Backend API - Docker Compose
# This compose file runs only Zou components. Kitsu frontend runs separately.

services:
  postgres:
    image: postgres:16-alpine
    container_name: zou-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-zoudb}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - ${POSTGRES_DATA_PATH:-zou-postgres-data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zou-internal
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: zou-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - zou-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zou-internal
    deploy:
      resources:
        limits:
          memory: 512M

  zou:
    image: ${ZOU_IMAGE:-zou:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zou-app
    restart: unless-stopped
    ports:
      - "${ZOU_PORT:-5000}:5000"
    secrets:
      - secret_key
      - db_password
      - mail_password
      - indexer_key
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_DATABASE=${DB_DATABASE:-zoudb}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-30}
      - KV_HOST=redis
      - KV_PORT=6379
      - DEBUG=${DEBUG:-false}
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - DOMAIN_PROTOCOL=${DOMAIN_PROTOCOL:-https}
      - MAIL_ENABLED=${MAIL_ENABLED:-false}
      - MAIL_SERVER=${MAIL_SERVER:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_USE_TLS=${MAIL_USE_TLS:-true}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER:-}
      - INDEXER_HOST=${INDEXER_HOST:-}
      - INDEXER_PORT=${INDEXER_PORT:-7700}
    volumes:
      - ${PREVIEWS_PATH:-zou-previews}:/app/previews
      - ${TMP_PATH:-zou-tmp}:/app/tmp
      - ${PLUGINS_PATH:-zou-plugins}:/app/plugins
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zou-internal
      - zou-external
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Database initialization (run once)
  zou-init:
    image: ${ZOU_IMAGE:-zou:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zou-init
    secrets:
      - db_password
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_DATABASE=${DB_DATABASE:-zoudb}
      - KV_HOST=redis
      - KV_PORT=6379
    entrypoint: ["/app/entrypoint.sh"]
    command: sh -c "zou init-db && zou init-data"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zou-internal
    profiles:
      - init

  # WebSocket event stream server (optional)
  zou-events:
    image: ${ZOU_IMAGE:-zou:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zou-events
    restart: unless-stopped
    ports:
      - "${ZOU_EVENTS_PORT:-5001}:5001"
    secrets:
      - secret_key
      - db_password
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_DATABASE=${DB_DATABASE:-zoudb}
      - KV_HOST=redis
      - KV_PORT=6379
      - EVENT_STREAM_HOST=0.0.0.0
      - EVENT_STREAM_PORT=5001
    entrypoint: ["/app/entrypoint.sh"]
    command: ["python", "-m", "zou.event_stream"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zou-internal
      - zou-external
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    profiles:
      - events

  # Full-text search (optional)
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: zou-meilisearch
    restart: unless-stopped
    secrets:
      - indexer_key
    entrypoint: ["/bin/sh", "-c", "export MEILI_MASTER_KEY=$(cat /run/secrets/indexer_key) && exec meilisearch"]
    environment:
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
    volumes:
      - zou-meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zou-internal
    deploy:
      resources:
        limits:
          memory: 1G
    profiles:
      - search

secrets:
  secret_key:
    file: ./secrets/secret_key.txt
  db_password:
    file: ./secrets/db_password.txt
  mail_password:
    file: ./secrets/mail_password.txt
  indexer_key:
    file: ./secrets/indexer_key.txt

networks:
  zou-internal:
    driver: bridge
    internal: true
  zou-external:
    driver: bridge

volumes:
  zou-postgres-data:
  zou-redis-data:
  zou-previews:
  zou-tmp:
  zou-plugins:
  zou-meilisearch-data:
